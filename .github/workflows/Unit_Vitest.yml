name: Unit Tests (Vitest)
on:
  pull_request:
    branches: [dev]
jobs:
  Unit-test-vitest:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20.13.1
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npx vitest
