name: Generate Resized Images

on:
  pull_request:
    branches:
      - dev

jobs:
    run-script:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        steps:
            - name: Install Pillow package
              run: |
                python -m pip install --upgrade pip
                pip install Pillow
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Run image resize script
              id: run_resize
              run: python scripts/image_resize.py
            - name: Save and commit results
              uses: stefanzweifel/git-auto-commit-action@v5
              with:
                commit_message: Created resized images based on latest changes