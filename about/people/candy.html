						kit.start(app, element, {
							node_ids: [0, 3, 10],
							data: [{type:"data",data:{articleData:{"image-credits":{title:"Image Credits",id:"image-credits",parent:"about",link:"about/image-credits",lead:"A list of credits for all the images used in *Bee-ing Human*.",img:"assets/ben-marler-qQFuht8IFw0-unsplash.jpg",imgAlt:"a rock with writing on it that says, the cave",type:["data"],layout:"article",author:"tiago",date:"2025/06/19",order:3},introduction:{title:"Introduction",id:"introduction",parent:"about",link:"about/introduction",lead:"Learn about the *Bee-ing Human* project, its goals, ambitions, ways of working and how we created a 21st century digital bee book.",img:"assets/articles/introduction/zulian-firmansyah-sEUAJeFn5mE-unsplash.jpg",imgAlt:"An open door to a dreamlike world on an orange wall",type:["article"],layout:"article",author:["jenny","tiago","olivia"],date:"2025/07/25",order:1},people:{title:"People",id:"people",parent:"about",link:"about/people",lead:"Meet the people behind *Bee-ing Human* and its extended network of collaborators.",img:"assets/jacqueline-o-gara-ZLkmJVCOYq8-unsplash.jpg",imgAlt:"a number of bees approaching the entrance to a wooden hive",type:["data"],order:2},"project-timeline":{title:"Project timeline",id:"project-timeline",parent:"about",link:"about/project-timeline",lead:"Here we detail the journey of the *Bee-ing Human* project, from the first discussions over a coffee, to the finished digital book you are reading today.",img:"assets/articles/project-timeline/sigmund-ZLst8z_M6_8-unsplash.jpg",imgAlt:"A series of calendar pages spread about",type:["article"],layout:"article",author:["jenny","tiago"],date:"2025/08/18",order:3},"beecoming-home":{title:"Becoming Home: A blending of Art and Nature ",id:"beecoming-home",parent:"connections",link:"connections/beecoming-home",lead:"This project invited global artists to collaborate with bees by placing sculptures inside of active honeybee hives. The bees contribute by building honeycomb onto the artwork, creating living organic sculptures that highlight pollinator diversity and the beauty of interspecies collaboration.",img:"assets/articles/beecoming-home/image1.jpg",imgAlt:"honeycomb built on top of open books",type:["article"],layout:"article",author:["luke","sarah"],date:"2025/06/25"},"beekeepers-survey":{title:"Beekeepers' Survey",id:"beekeepers-survey",parent:"connections",link:"connections/beekeepers-survey",lead:"Butler left his books in his study and chose instead to observe and listen to bees in the field. We are particularly interested in his study of swarms. We hope that today's beekeepers can add their knowledge to our project.",img:"assets/articles/beekeepers-survey/glenn-carstens-peters-RLw-UC03Gwc-unsplash.jpg",imgAlt:"a handwritten list with empty checkboxes",type:["article","experience","data"],layout:"article",author:["bennett","jenny"],date:"2025/04/11"},"connections-buzzwords":{title:"Buzzwords feed",id:"connections-buzzwords",parent:"connections",link:"connections/buzzwords-feed",lead:"Buzzwords are the little thoughts and diversions we came across during our discussions and research. They might be tangential to our main topic, or an aside that seems pertinent enough to be recorded. Some of these buzzwords might turn into longer articles, others will remain here as a fleeting reflection.",img:"assets/glen-carrie-oHoBIbDj7lo-unsplash.jpg",imgAlt:"a view of a minaret from a ruined stone doorway or window",type:["experience"],layout:false},"cool-tunes-podcast":{title:"Cool Tunes For a Hot Planet Podcast",id:"cool-tunes-podcast",parent:"connections",link:"connections/cool-tunes-podcast",lead:"Produced by a team of like-minded musician/activists, the podcast explores the intersection of music and the struggle for social and environmental justice. The 'bees' episode grew from a belief that music from multiple places and times, but centered around universal human experiences, would create compelling and meaningful programming",img:"assets/articles/cool-tunes-podcast/will-francis-ZDNyhmgkZlQ-unsplash.jpg",imgAlt:"Description of the cover image",type:["article","media"],layout:"article",author:"warren",date:"2025/05/19"},"connections-queen-bee":{title:"Thought experiment: a queen bee in interdisciplinary space",id:"connections-queen-bee",parent:"connections",link:"connections/queen-bee",lead:"We've been looking at how this book thinks with bees, and how the writing uses all these modes to move around the bees creating emotional insight. Its polyphony is a prompt and a challenge. The many elements of the book naturally worked together in Butler's mind, but in 2024 they are distributed between specialisms in the departments of the university. Revisiting Butler's book with a team representing the different strands of his thinking offers a unique chance to see how what we now call 'interdisciplinarity' works",img:"assets/articles/queen-bee/leandro-fregoni-984b72nd5hg-unsplash.jpg",imgAlt:"black and yellow bee on white surface",type:["article"],layout:"article",author:"olivia",date:"2025/01/20"},"where-the-bee-sucks":{title:"A film about bees and bee keeping ",id:"where-the-bee-sucks",parent:"connections",link:"connections/where-the-bee-sucks",lead:"*Where the Bee Sucks* is a 50 min film that looks at the year long cycle of bee keeping from the point of view of Ralph, the bee keeper.",img:"assets/articles/where-the-bee-sucks/screengrab.png",imgAlt:"A screen grab from Where the Bee Sucks, depicting the beekeeper, Ralph, tending to his hives dressed in a green smock and face veil.",type:["article","media"],layout:"article",author:"adrin",date:"2025/04/24"},"bee-hold":{title:"Bee-hold: Feeling the Buzz of Early Modern Natural Philosophy",id:"bee-hold",parent:"literature",link:"literature/bee-hold",lead:"The practice of 'feeling' is central to seventeenth-century scientific activity. Butler's chilled bee acts as a cautionary example of the ethical complexity of 'bee-holding', where 'feeling' as an interdisciplinary practice both permits and undermines mutual exchanges between the human and more-than-human.",img:"assets/articles/bee-hold/cover.jpeg",imgAlt:"A detail of a bee sting, from Robert Hooke's Micrographia",type:["article"],layout:"article",author:"jess",date:"2025/07/08",order:3},"book-hive":{title:"The Book as a Hive",id:"book-hive",parent:"literature",link:"literature/book-hive",lead:"The idea that we are entering a 'hive' when we open the 1623 edition is also suggested by this work’s material features, indicating Butler’s collaboration with the printer, Haviland. One of those features meets us as soon as we open the book: the new woodcut facing the titlepage.",img:"assets/articles/book-hive/hive-fp.jpg",imgAlt:"detail of the Feminine Monarchie frontespiece (1623) showing an illustration of a hive: a stylised series of hexagons with a few oversized bees over it. Around the hive the words: Solertia et Labore; below: Socordiam Lvimvs",type:["article"],layout:"article",author:"jenny",date:"2025/01/03",order:2},"cross-references":{title:"Cross-references",id:"cross-references",parent:"literature",link:"literature/cross-references",lead:"A draft visualisation of the internal cross-referencing systems in the 1623 and 1609 editions of the Feminine Monarchie",img:"assets/articles/cross-references/simon-kadula-DIwC450lRGI-unsplash.jpg",imgAlt:"a group of bees on top of a hive-like background",type:["data"],author:"tiago",date:"2025/07/10",order:4},transcription:{title:"*The Feminine Monarchie*",id:"transcription",parent:"literature",link:"literature/transcription",lead:"The scholarly digital edition of Charles Butler's *The Feminine Monarchie* (1623), by Jennifer Richards, Olivia Smith, and Tiago Sousa Garcia",img:"assets/andrew-seaman--m88z7ily-w-unsplash.jpg",imgAlt:"a picture of a typewriter",dataSelector:true,dataSelectorControls:[{dataSource:true,type:"select",label:"dataSource",default:"1623",values:{"1609":"1609","1623":"1623","1634":"1634"}},{dataSource:false,type:"navigator",listIndex:[["Titlepage","titlepage"],["Preface","preface"],["Ad Autorem","dedication"],["Table of Contents","contents"],["Chapter 1","ch1"],["Chapter 2","ch2"],["Chapter 3","ch3"],["Chapter 4","ch4"],["Chapter 5","ch5"],["Chapter 6","ch6"],["Chapter 7","ch7"],["Chapter 8","ch8"],["Chapter 9","ch9"],["Chapter 10","ch10"]],defaultSelected:"titlepage"},{dataSource:false,type:"radioGroup",label:"view",defaultValue:"both",values:{facsimile:"facsimile",both:"both",transcription:"transcription"}},{dataSource:false,type:"radioGroup",label:"variation",defaultValue:"no variation",values:{"no variation":"no variation","major changes":"major changes","all changes":"all changes"}},{dataSource:false,type:"toggle",label:"editorial notes",values:{default:false}},{dataSource:false,type:"toggle",label:"translations",values:{default:false}}],type:["data","experience"],order:1},"EPV-performance":{title:"Ensemble Pro Victoria Performance",id:"EPV-performance",parent:"music",link:"music/EPV-performance",lead:"Ensemble Pro Victoria bring Charles Butler’s Melissomelos to life in Newcastle University’s King’s Hall, February 2024.",img:"assets/articles/EPV-performance/EPV-at-New-Coll.png",imgAlt:"choir singing in a darkened church",type:["media"],layout:"article",author:"magnus",date:"2025/04/03"},"chapel-in-the-hive":{title:"Chapel in the Hive",id:"chapel-in-the-hive",parent:"music",link:"music/chapel-in-the-hive",lead:"Joseph Campana writes about his collaboration with Kurt Stallmann in 'The Chapel in the Hive', a performance of poetry inspired by an intriguing passage from Charles Butler's *Feminine Monarchie*.",img:"assets/articles/chapel-in-the-hive/DSC_0609-67.jpg",imgAlt:"A picture of the interior ceiling of La Sagrada Familia in Barcelona",type:["article","media"],layout:"article",author:"joseph",date:"2025/08/04"},"melisosomelos-edition":{title:"*Melissomelos*",id:"melisosomelos-edition",parent:"music",link:"music/melissomelos-edition",lead:"Complete edition by Magnus Williamson for the *Bee-ing Human project* (Leverhulme Trust, 2022-25). First performed complete by Ensemble Pro Victoria, Newcastle University, 29 February 2024.",img:"assets/articles/melissomelos-edition/2023-1081_0093.jpg",imgAlt:"A music page from Butlers Feminine Monarchie",type:["data"],layout:"article",author:"magnus",date:"2025/06/06"},"music-book-layout":{title:"Music-book Layout: Functionality and Sociability",id:"music-book-layout",parent:"music",link:"music/music-book-layout",lead:"The musicians need to be positioned so they can hear – and ideally, see – one another extremely well. This means close physical proximity, which in turn enhances the particular social intimacy of making music from individual parts. The few early modern images we have of part-book or choir-book performances show just this: the musicians are usually standing close together or sitting clustered around a table or music stand and are often touching one another.",img:"assets/articles/music-book-layout/louie_detail.jpeg",imgAlt:"needs an alt",type:["article"],layout:"article",author:"richard",date:"2025/06/09"},"performing-melissomelos":{title:"Performing *Melissomelos*",id:"performing-melissomelos",parent:"music",link:"music/performing-melissomelos",lead:"While revisiting his first encounter with *Melissomelos*, Simon Jackson explores his approach in performing Butler's song of Bees.",img:"assets/articles/performing-melissomelos/susan-wilkinson-fMXyMuOxuYU-unsplash.jpg",imgAlt:"An abstract painting of soundwaves in blue and cream tones",type:["article","media"],layout:"article",author:"simon-jackson",date:"2025/08/05"},"conscious-beeing":{title:"The honey bee: a conscious bee-ing?",id:"conscious-beeing",parent:"science",link:"science/conscious-beeing",lead:"Bees are a flagship species in the study of invertebrate consciousness. Beloved by the public for their ecological importance and complex social behaviors, they provide a unique opportunity to engage society in the broader discussion about animal consciousness.",img:"assets/articles/conscious-beeing/alexander-grey-p203ekCK4Ac-unsplash.jpg",imgAlt:"Psychedelic colorful rainbow paint wallpaper background.",type:["article"],layout:"article",author:["catherine","luigi","martin"],date:"2025/04/10"},"science-datasets":{title:"Datasets",id:"science-datasets",parent:"science",link:"science/datasets",lead:"Here you will find the raw data for some of the experiments we ran in the bee lab, for you to explore in various forms, validate our interpretations, and draw your own conclusions.",img:"assets/pexels-murillohm-10854279.jpg",imgAlt:"a neatly arranged pile of wood",type:["data"],dataSelector:true,dataSelectorControls:[{dataSource:true,type:"select",label:"dataSource",default:0,values:{"Dataset 1":0}},{dataSource:false,type:"radioGroup",label:"view",defaultValue:"details",values:{details:"details",visualisation:"visualisation",summary:"summary",data:"data"}}],layout:false},"emotions-in-invertebrates":{title:"Inner life – emotions – in invertebrates",id:"emotions-in-invertebrates",parent:"science",link:"science/emotions-in-invertebrates",lead:"The study of emotions in invertebrates has been a subject of both intrigue and scepticism. While challenging our anthropocentric notions, the investigation of emotions in invertebrates promises to broaden the understanding of the evolutionary origins and adaptive functions of these phenomena across the animal kingdom.",img:"assets/articles/emotions-in-invertebrates/bioscience-image-library-by-fayette-reynolds-wDH7c3pXkpY-unsplash.jpg",imgAlt:"Nervous Tissue: Spinal Cord Motor Neuron. smear: spinal cord magnification: 200x",type:["article"],layout:"article",author:["luigi","vivek"],date:"2025/03/03"}},searchIndex:"{\"version\":\"2.3.9\",\"fields\":[\"title\",\"content\",\"author\"],\"fieldVectors\":[[\"title/image-credits\",[0,1.49,1,2.617]],[\"content/image-credits\",[0,2.01,1,1.927,2,0.098,3,0.288,4,0.463,5,2.371,6,2.371,7,0.189,8,0.189,9,0.477,10,0.602,11,1.243,12,1.417,13,5.535,14,3.737,15,0.973,16, , the history of reading, history of rhetoric (with a focus on delivery), and scholarly editing. Her most recent book, *Voices and Books in the English Renaissance: A New History of Reading*, was published by Oxford in 2019. It was out of this work on voice, rhetoric and reading that her interest in Charles Butler's study of the sound of bees began. As Chair of the English Association, and in collaboration with the School of Advanced Studies, London, she has launched an online series exploring collaboration: ['Thinking Forwards'](https://englishassociation.ac.uk/thinking-forwards-collaboration/).",socials:{X:"https://x.com/JenniferRichar7",bluesky:"https://bsky.app/profile/jennyrichards.bsky.social"},web:{staff:"https://www.english.cam.ac.uk/people/Jennifer.Richards"},email:"jr970@cam.ac.uk",role:"core"},olivia:{name:"Olivia Smith",img:"assets/people/OliviaSmith.jpg",url:"people/olivia",title:"Research Associate",affiliation:"University of Cambridge",bio:"Olivia Smith works on early modern literature, with a focus on natural history and science writing, and histories of emotion and cognition. Before coming to Cambridge, she was Balzan Research Fellow and then Wellcome Trust Research Fellow at Oxford. She has devised masterclasses at the Royal College of Physicians and in the Wellcome archive, and is interested in articulating the value of a humanities skillset across the disciplines. With colleagues in Modern Languages she's co-edited the books *Cognitive Confusions: Dreams, Delusions and Illusions in Early Modern Culture* (2017) and the forthcoming *Elemental Objects: Proceedings from a Virtual Showcase* (2025). Her most recently published essay is a piece on the early modern condition of erotomania, which appears in *Love: A Cultural History*, edited by Katherine Ibbett (2024).",socials:{bluesky:"https://bsky.app/profile/oliviasmith.bsky.social"},email:"ofs20@cam.ac.uk",role:"core"},bennett:{name:"Bennett Hogg",img:"assets/people/bennett_avatar.png",url:"people/bennett",title:"Senior Lecturer",affiliation:"Newcastle University",bio:"Bennett Hogg teaches musicology and composition at Newcastle University and is a keen amateur natural historian. He has researched extensively in the fields of both scholarly and creative practices in the areas of environmental sound (AHRC '\u003Ca href='https://landscapequartet.org/' target='_blank'>Landscape Quartet\u003C/a>', 2012-2014), biophonics, and relationships between music and nature. From February to September 2014 he was Austrian Science Fund (FWF) research fellow at Kunst Universitat, Graz on the 'Emotional Improvisation' project led by Prof Deniz Peters. Since 2010 he has collaborated with German flautist and environmental sound artist \u003Ca href='https://sabvog.de/' target='_blank'>Sabine Vogel\u003C/a> of Berlin's Splitter Orchester. His most recent work has included the role played by aesthetics and spatial awareness in data sonification (\u003Ca href='https://projectradical.github.io/about/' target='_blank'>Leverhulme Trust 2021-2024\u003C/a>; \u003Ca href='https://sonicintangibles.github.io/about/' target='_blank'>UKRI 2025-2027\u003C/a>), and the early atonal music of Anton von Webern, specifically its connetion with ideas of space/place and the natural environment. He kept bees as a teenager and came perilously close to becoming an environmental scientist before opting to study music as an undergraduate.",role:"core"},magnus:{name:"Magnus Williamson",img:"assets/people/magnus_headshot.jpg",url:"people/magnus",title:"Professor of Early Music",affiliation:"Newcastle University",bio:"Magnus Williamson (FSA) researches the musical traditions of late-medieval and early modern Europe, especially in the sources and contexts of early-Tudor polyphony. He has led and participated in a number of collaborative projects: the Early English Organ Project; the *Experience of Worship* (AHRC/ESRC, 2009-12); *Dispositifs de la Performance Musicale à la Renaissance* (CNRS/Le Studium, 2013-14); *Tudor Partbooks* (AHRC, 2014-17); *Tallis* (Leverhulme Trust, visiting fellowship, 2017); the *Sarum Hymnal in Manuscript and Print* (British Academy, 2017-18); *English Saints Offices* (British Academy, 2029-21); *Aural Histories* (AHRC, 2022-25); *Henry VIII on Tour* (2022-25) and *Bee-ing Human* (Leverhulme Trust, 2022-25).  His facsimile edition of the Eton Choirbook (Oxford, 2010) won the American Musicological Society's Palisca Prize. He is chairman of the British Academy edition, Early English Church Music.",web:{googleScholar:"https://scholar.google.com/citations?user=nGbUCf0AAAAJ&hl=it",staff:"https://www.ncl.ac.uk/sacs/people/profile/magnuswilliamson.html",personal:"http://www.tudorpartbooks.ac.uk/"},email:"magnus.williamson@ncl.ac.uk",role:"core"},tiago:{name:"Tiago Sousa Garcia",byLastName:"Sousa Garcia, Tiago",title:"Senior Research Software Engineer",affiliation:"Newcastle University",img:"assets/people/tsg.png",url:"people/tiago",bio:"Tiago is a frontend web developer and digital humanist. Before his graduate and post-graduate education in literature, he worked as a software developer and studied computer engineering in Portugal. Between 2017 and 2021, he was the Research Associate for the *[ATNU](https://research.ncl.ac.uk/atnu/)* project, based at the School of English, where he also taught literary and digital humanities' focused modules. In 2020-2021, he convened and ran the *Coding for Humanists* study group, and from 2022 he is one of the co-convenors of the *Code Community* at Newcastle University. Until 2022 he was a co-managing editor of the *[Journal of the Text Encoding Initiative](https://journals.openedition.org/jtei/)* and an editorial assistant for *[The Programming Historian](https://programminghistorian.org/en/)*",socials:{bluesky:"https://bsky.app/profile/tiagosousagarcia.bsky.social",github:"https://github.com/tiagosousagarcia",orcid:"https://orcid.org/0000-0001-5694-7285"},web:{personal:"https://tiagosousagarcia.co.uk/",staff:"https://rse.ncldata.dev/team/tiago-sousa-garcia"},email:"tiago.sousa-garcia@newcastle.ac.uk",role:"core"},balu:{name:"Balamurali G. S.",img:"assets/people/Balu_pic.JPG",url:"people/balu",title:"Associate Professor",affiliation:"Atria University",bio:"Balu joined the project from 2022 to 2023. He completed his PhD at the Indian Institute of Science Education and Research, Thiruvananthapuram and joined us after postdoctoral research there and at Lund University. He is now an Associate Professor at Atria University, Bengaluru.",role:"core"},vivek:{name:"Vivek Nityananda",img:"assets/people/Vivek_hs.jpg",url:"people/vivek",title:"Senior Lecturer",affiliation:"Bioscience Institute, Newcastle University",bio:"Vivek Nityananda received his PhD from the Indian Institute of Science, Bengaluru. He worked in Minneapolis and London before moving to Newcastle University where he is now a Senior Lecturer. He researches insect vision, cognition and welfare. He is also interested in pessimism and optimism and has written a book on overconfidence. He collaborates with researchers in the arts and humanities and regularly communicates science through cartoons, animation and plays.",socials:{bluesky:"https://bsky.app/profile/viveknityananda.bsky.social",orcid:"https://orcid.org/0000-0002-2878-2425"},web:{personal:"https://www.viveknityananda.com",staff:"https://www.ncl.ac.uk/cbe/about/staff/profile/viveknityananda.html"},email:"vivek.nityananda@newcastle.ac.uk",role:"core"},luigi:{name:"Luigi Baciadonna",img:"assets/people/lb2.png",url:"people/luigi",title:"Research Associate",affiliation:"Newcastle University and University of Turin",bio:"Luigi Baciadonna has a background in psychology and obtained his PhD in Biological Sciences from Queen Mary University of London in 2017. His research focuses on the expression and perception of emotions across different animal species, ranging from insects to vertebrates. After almost a decade in the UK he moved to Italy to work on the cognitive and perceptual abilities in African penguins. In 2022, he was awarded a Marie Skłodowska-Curie Fellowship (FEAR-BEES) to conduct a European project on the neurobiological mechanisms of fear in honey bees at the French CNRS (IBPS - Paris Sorbonne & CBI-CRCA - Paul Sabatier University) and the University of Florence (Italy). His work integrates behavioural, cognitive and neurophysiological approaches to explore how emotions shape cognition and decision-making in animals. ",email:"luigi.baciadonna@newcastle.ac.uk",socials:{X:"https://x.com/LBaciadonna",orcid:"https://orcid.org/0000-0003-0011-801X"},web:{staff:"https://www.researchgate.net/profile/Luigi-Baciadonna?ev=hdr_xprf"},role:"core"},martin:{name:"Martin Giurfa",img:"assets/people/gr1_lrg.jpg",url:"people/martin",title:"Professor",affiliation:"Institute of Biology Paris, Seine - Sorbonne University Paris",bio:"Martin Giurfa is an Exceptional-Class Professor of Neurosciences at Sorbonne University, where he directs the Institute of Biology Paris-Seine. His research focuses on learning, memory and cognitive processing in insects, from behavior to molecules. He has brought a cognitive dimension to studies on honey bee learning and memory as his work revealed bees under the new light of their remarkable cognitive faculties. ",email:"",socials:{orcid:"https://orcid.org/0000-0001-7173-769X"},web:{staff:""},role:"contributor"},catherine:{name:"Catherine Macri",img:"assets/people/203.png",url:"people/catherine",title:"Doctoral Candidate",affiliation:"CNRS - NeuroSU, Institute of Biology Paris Seine",bio:"Catherine Macri - Doctoral Candidate, CNRS - NeuroSU, Institute of Biology Paris Seine, Sorbonne university & Research Center on Animal Cognition, University of Toulouse - Investigates markers of consciousness (such as perceptual awareness and fear) in honey bees, at the behavioral, physiological and neurobiological level.",email:"",socials:{orcid:"https://orcid.org/0000-0002-2775-3059"},web:{},role:"contributor"},adrin:{name:"adrin neatrour",img:"assets/people/adrin.jpg",url:"people/adrin",title:"",affiliation:"",bio:"Born in London 1948,  I was a post-war boy child with a GI dad and a Yorkshire mum, I went to St Pauls School in London and attended first Sussex University then Cambridge where respectively I studied Sociology and Criminology.  After University I worked as a lecturer at Newcastle Polytechnic (now Northumbria University) but never felt that teaching was right for me.  I gave it up and embarked on a life in the theatre founding and developing local NE companies such as Mamon Theatre Group and Skin and Bones.  Seeing the films of Godard in the 1960's showed me anyone could make a film if they really wanted. I started to make films in standard 8 and super 8 systems, eventually teaching myself 16mm skills and from the 1980's to date have made some 16 documentaries (some of which can be found at www.crinklecut.co.uk )   many of which concentrate on the practice of work.",email:"",socials:{},web:{},role:"contributor"},warren:{name:"Warren Senders",img:"assets/people/warren_senders.jpg",url:"people/warren",title:"",affiliation:"",bio:"Warren Senders is a musician, educator, and activist living outside of Boston in the city of Medford, Massachusetts. He is a faculty member at New England Conservatory of Music, and a scholar/performer specializing in North Indian (Hindustani) classical singing. \u003Cbr/>His work in climate activism began in 2009. Since then, he has: \u003Cul class='list-disc ml-8'>\u003Cli>Produced a series of 21 semi-annual benefit concerts for [350.org](https://www.350.org) and [350MA.org](http://www.350MA.org), under the heading, 'Playing For The Planet: World Music Against Climate Change.'\u003Cul>\u003Cli>[https://artsfuse.org/45084/fuse-music-feature-playing-for-the-planet/](https://artsfuse.org/45084/fuse-music-feature-playing-for-the-planet/)\u003C/li>\u003Cli>[https://www.bostoncentral.com/events/music/p62785.php](https://www.bostoncentral.com/events/music/p62785.php)\u003C/li>\u003C/ul>The concert series came to a close at the beginning of the pandemic.\u003C/li>\u003Cli>Curated 45 hours of streaming music videos and interviews during the 2021 Glasgow COP as the Programming Director of **Music For Climate Justice** (M4CJ).  The programming included over 450 different artists in an exceptionally wide range of musical genres and performances centered on environmental awareness and justice.  The 'Music For Climate Justice Video Festival' was almost certainly the most diverse musical event in history, featuring artists ranging from Pete Seeger to John Cage, from underwater video recorded in Antarctica to the voices of astronauts in the ISS, from Terje Isungset's instruments made of glacial ice to the 'pyrophones' of fire musician Michel Moglia.\u003Cul>\u003Cli>[https://events.music4climatejustice.org/en/](https://events.music4climatejustice.org/en/)\u003C/li>\u003Cli>[https://www.rollingstone.com/music/music-news/bootsy-collins-steven-van-zandt-music4climatejustice-festival-1252340/](https://www.rollingstone.com/music/music-news/bootsy-collins-steven-van-zandt-music4climatejustice-festival-1252340/)\u003C/li>\u003Cli>[https://www.youtube.com/watch?v=daC9CT4G-ig](https://www.youtube.com/watch?v=daC9CT4G-ig)\u003C/li>\u003C/ul>\u003C/li>\u003Cli>Written 1461 climate-focused letters to the editor between January 1, 2010 and December 31, 2014 — one letter a day for four years to newspapers, magazines, and journals. Letters were published all over the world; US appearances included the New York Times, Washington Post, Time Magazine, USA Today, and many regional newspapers/magazines.\u003Cul>\u003Cli>[Sample letter published in the Portland Press-Herald, 12/29/2013](https://www.pressherald.com/2013/12/29/letters_to_the_editor__lepage_wrong_to_embrace_climate_change_as_potential_profit_center/)\u003C/li>\u003Cli>[Sample letter published in the Cleveland Plain Dealer, November 15, 2013](https://www.cleveland.com/letters/2013/11/letter_to_the_editor_365.html)\u003C/li>\u003C/ul>\u003C/li>\u003Cli>Maintains a daily 'Climate Vigil' at Roosevelt Circle in Medford, a heavily-trafficked intersection near his home. He and vigil partner Craige Knopf stand with signs about climate change for one hour every weekday morning between 7:30-8:30. Articles have been written about this ongoing action (2015-present) in the US and India:\u003Cul>\u003Cli>[https://www.thehindu.com/news/cities/mumbai/entertainment/man-with-sign-and-raga/article8383653.ece?ref=tpnews](https://www.thehindu.com/news/cities/mumbai/entertainment/man-with-sign-and-raga/article8383653.ece?ref=tpnews)\u003C/li>\u003Cli>[https://orionmagazine.org/article/protest-as-practice/](https://orionmagazine.org/article/protest-as-practice/)\u003C/li>\u003Cli>[https://indianexpress.com/article/express-sunday-eye/notes-from-a-dying-planet-5574200/](https://indianexpress.com/article/express-sunday-eye/notes-from-a-dying-planet-5574200/)\u003C/li>\u003C/ul>\u003C/li>\u003Cli>Was part of the West Roxbury 13, whose civil disobedience in blocking a LNG Pipeline led to the first successful US use of the Necessity Defense.\u003Cul>\u003Cli>[http://www.ililani.media/2018/04/climate-activists-successfully-relied.html](http://www.ililani.media/2018/04/climate-activists-successfully-relied.html)\u003C/li>\u003Cli>[https://www.youtube.com/watch?v=hZdMZ5fTsQs](https://www.youtube.com/watch?v=hZdMZ5fTsQs)\u003C/li>\u003C/ul>He has been arrested for NVCD several times in the years since then, mostly through Extinction Rebellion's Boston chapter.\u003C/li>\u003Cli>Mr. Senders teaches a course at New England Conservatory in which students make their own instruments from recycled & trash materials, thereby transforming their understanding of, and relationship to, the consumer economy and the waste stream.\u003Cul>\u003Cli>[https://www.youtube.com/watch?v=tuY6GCk1UNc](https://www.youtube.com/watch?v=tuY6GCk1UNc)\u003C/li>\u003C/ul>\u003C/li>\u003Cli>He prepared this personal summary for the political blog 'Balloon-Juice' almost exactly a year ago:\u003Cul>\u003Cli>[https://balloon-juice.com/2024/01/06/warren-senders-music-and-conscience/](https://balloon-juice.com/2024/01/06/warren-senders-music-and-conscience/)\u003C/li>\u003C/ul>\u003C/li>\u003C/ul>",email:"",socials:{},web:{staff:"https://necmusic.edu/faculty/warren-senders"},role:"contributor"},richard:{name:"Richard Wistreich",img:"assets/people/richardwistreich.jpg",url:"people/richard",title:"Professor of Music History",affiliation:"Royal College of Music",bio:"Richard Wistreich is Professor of Music History at the Royal College of Music. He works on aspects of performance and materiality, currently focusing on the role of voice in the construction of early modern identity. *Warrior, Courtier, Singer: Giulio Cesare Brancaccio and the Performance of Identity in the Late Renaissance*, based on his PhD dissertation, came out with Ashgate in 2007. Since then, he has published widely on the history of singing, and on the composer, Claudio Monteverdi; he has co-edited (with Iain Fenlon) the *Cambridge History of Sixteenth Century Music*. Richard has also had a long career as a professional singer and performance teacher, specialising in music of the sixteenth and seventeenth centuries.",email:"",socials:{},web:{staff:"https://www.rcm.ac.uk/research/people/details/?id=03709"},role:"advisory-board"},henry:{name:"Henry Howard",img:"assets/people/Henry_Howard.jpg",url:"people/henry",title:"Translator",affiliation:"",bio:"Dr Henry Howard is a translator, editor, landowner, gardener, cathedral musician and breakfast chef. His translations of *Early English Saints' Offices* (edited by David Hiley) will shortly be published by Stainer and Bell for the British Academy in the Early English Church Music series. He is currently working with John Harper on a translation and edition of the Old Customary of Salisbury Cathedral. His translation from the Romanian of Max Blecher's novel *Scarred Hearts*, published in 2009, currently ranks 1,155,549 in Books on Amazon. Henry lives in Cumbria amid a small herd of free-range Oxford Sandy and Black pigs.",email:"",socials:{},web:{},role:"contributor"},luke:{name:"Luke Howard",img:"assets/people/luke_howard.jpg",url:"people/luke",title:"",affiliation:"",bio:"\u003Cp>Luke Howard established \u003Ca href='https://www.beethecollective.com/' target='_blank'>The Bee Collective\u003C/a> five years ago in Columbus, Ohio. An organization dedicated to creating vital pollinator habitats and promoting ecological stewardship through educational initiatives. Luke began his beekeeping journey nine years ago, driven by a desire to create a practical and professional connection with honeybees which provided the impetus for his commitment to broader pollinator conservation. The Bee Collective has successfully converted 1.25 acres of previously vacant or underutilized urban land into flourishing pollinator ecosystems. The organization has also forged collaborations with nine community gardens to develop pollinator-friendly environments. Their outreach extends to hosting over 120 ecology-based educational events and producing high-end native bee homes for public use.\u003C/p>\u003Cp>Four years ago, Luke Howard partnered with Dr. Scott to launch The Beecoming Home project. This innovative venture integrates art and ecological principles, inviting international artists to collaborate with honeybees. The project's objectives are to cultivate community, share the intimate stories of artists and their work, while weaving in stories of our natural ecosystems to cretae both awareness and funding for pollinator habitat. To date, Beecoming Home has successfully secured $24,600 in funding, directly benefiting participating artists and habitat creation.\u003C/p>",socials:{},web:{},email:"#",role:"contributor"},sarah:{name:"Sarah Scott",img:"assets/people/S_Scott.jpg",url:"people/sarah",title:"",affiliation:"",bio:"\u003Cp>Sarah B. Scott is a pollinator ecologist and ecotoxicologist whose research explores the environmental drivers of pollinator health and decline. With an academic background in Zoology, Environmental Studies, and Art, she earned her PhD in Entomology from The Ohio State University. Her work focuses on the lethal and sublethal effects of metal contamination on bumble bee physiology, behavior, and overall fitness.\u003C/p>\u003Cp>Sarah was awarded a Royal Society Newton International Fellowship to continue her research at the University of Cambridge. There, she expanded her investigations to include the effects of metal exposure on pollinator behavior, biomechanics, and gene expression. She currently holds a research position at Newcastle University, where her work centers on wild bee welfare, including the development of non-lethal diagnostic tools to assess bee cognitive states in natural settings.\u003C/p>\u003Cp>Her research lies at the intersection of environmental toxicology, pollinator biology, and habitat quality, with the goal of identifying strategies to protect pollinators and the ecosystems they depend on. In addition to her scientific work, Sarah is deeply committed to science communication and is also a scientific illustrator.\u003C/p>",socials:{},web:{},email:"",role:"contributor"},"simon-davies":{name:"Simon Davies",img:"assets/people/simon_davies.jpg",url:"people/simon-davies",title:"Copyeditor",affiliation:"Modern Humanities Research Association",bio:"Simon F. Davies is Managing Editor of the Texts & Translations imprint for the Modern Humanities Research Association (MHRA). His research interests include the history of the book and early modern witchcraft. His publications include an edition of Edward Poeton's *The Winnowing of White Witchcraft* for Arizona Center for Medieval & Renaissance Studies. He is Assistant Editor of the *Annual Bibliography of English Language and Literature* and one of the editors of the MHRA Style Guide.",socials:{bluesky:"https://bsky.app/profile/simonfd.bsky.social"},web:{},email:"#",role:"contributor"},candy:{name:"Candy Rowe",img:"assets/people/Candy.jpg",url:"people/candy",title:"Professor of Animal Behaviour and Cognition",affiliation:"Newcastle University",bio:"My background is in animal behaviour research, with my research at Newcastle University focussing on better understanding the psychology and behaviour of humans and other animals. My research is by nature interdisciplinary, combining evolutionary and behavioural biology, experimental psychology and visual neuroscience to understand the design of animal signals. My love of research was actually ignited through a project on honeybees on an undergraduate field course, and I've used bee sounds in some of my early experiments too – so it's been great to be involved with this project. I currently call myself a 'part-time researcher', as for the last 10 years or so, I've spent two or more days a week in a series of leadership roles – as an EDI Director for my faculty, the Director of our university's interdisciplinary fellowship scheme (NUAcT) and now as Dean for Research Culture & Strategy. These roles reflect my passion for creating inclusive and energising cultures and environments for people to work, grow and thrive, and find connections across different disciplines, job roles and sectors. This project has been an exciting journey for me, to see how humanities and sciences approaches and methods can be woven into an exploration of bee sounds, emotions and behaviours – I've learned a lot.",email:"",socials:{},web:{staff:"https://www.ncl.ac.uk/cbe/about/staff/profile/candyrowe.html"},role:"advisory-board"},joseph:{name:"Joseph Campana",img:"assets/people/joe_campana.jpg",url:"people/joseph",title:"William Shakespeare Professor of English",affiliation:"Rice University",bio:"\u003Ca href='https://josephcampana.com/'>Joseph Campana\u003C/a> is a poet, arts reviewer, and scholar of early modern literature and culture who serves as the William Shakespeare Professor of English at Rice University where he has also directed the \u003Ca href='https://ces.rice.edu/'>Center for Environmental Studies\u003C/a>, the \u003Ca href='https://enst.rice.edu/'>Environmental Studies\u003C/a> curriculum, and \u003Ca href='https://ecostudio.world/'>EcoStudio\u003C/a>. He is the author of dozens of peer-reviewed essays and two monographs: \u003Cem>The Pain of Reformation: Spenser, Vulnerability, and the Ethics of Masculinity\u003C/em> (Fordham, 2012), and \u003Cem>Speculations on Sovereignty: Shakespeare's Once and Future Child\u003C/em> (Chicago, 2024) as well as the co-editor of a two-volume collection of essays on early modern insect life, \u003Cem>Lesser Living Creatures of Renaissance\u003C/em>, and of \u003Cem>Renaissance Posthumanism\u003C/em>. He has also published three collections of poetry: \u003Cem>The Book of Faces\u003C/em>, \u003Cem>Natural Selections\u003C/em>, and \u003Cem>The Book of Life\u003C/em>. He discovered Charles Butler's \u003Cem>The Feminine Monarchie\u003C/em> in graduate school and has been fascinated ever since. As a 2024-5 Fellow in Garden and Landscape Studies at Dumbarton Oaks, he launched a monograph project called \u003Cem>Scales of Nature: Thinking with Bees in the Renaissance\u003C/em>. With electroacoustic composer Kurt Stallmann, he has developed a series of poetry and music collaborations which include 'The Chapel in the Hive,' an evening length work drawing from Butler's text and music, which premiered at the Yale Institute for Sacred Music in 2025.",email:"jac4@rice.edu",socials:{},web:{staff:"https://profiles.rice.edu/faculty/joseph-campana",personal:"https://josephcampana.com/"},role:"advisory-board"},jess:{name:"Jess Dunmore",img:"assets/people/jess_dunmore.jpg",url:"people/jess",title:"PhD Student",affiliation:"University of Cambridge",bio:"Jess Dunmore is a PhD student in English Literature at the University of Cambridge. Having graduated from the University of Oxford, Jess studied an MPhil at Cambridge before progressing onto a PhD. Her research, which is generously funded by the Cambridge Trust and Newnham College, recovers the 'elemental ecopoetics' of early modern natural philosophy. Informed by the nexus of material, ecological, and poetic encounters that underpin her research, she embraces the opportunities and challenges posed by creative, interdisciplinary forms of criticism. When not immersed in the seventeenth century, Jess can usually be found in the lido or running out and about in the countryside.",role:"contributor"},emily:{name:"Emily Doolittle",img:"assets/people/Emily_Doolittle.jpg",url:"people/emily",title:"Athenaeum Research Fellow and Lecturer in Composition",affiliation:"Royal Conservatoire of Scotland",bio:"Dr Emily Doolittle is a Canadian-born, Glasgow-based music researcher and composer with an ongoing interest in zoomusicology, the study of the music-like aspects of non-human animal song. Doolittle's zoomusicological outputs include compositions, inter-species improvisations, musicological and cultural studies, and interdisciplinary scientific collaborations. Other research interests include gender and creativity, storytelling through music, and environmental activism and the arts. In addition to her own interdisciplinary research, she facilitates interdisciplinary research for others through the founding and co-organizing of \u003Ca href='https://shareinterdisciplinary.co.uk/' target='_blank'>SHARE (Science, Humanities and Arts Research Exchange)\u003C/a> and \u003Ca href='https://shareinterdisciplinary.co.uk/projects/rascal/' target='_blank'>RASCAL (Research on Animal Songs in Culture, Art and Literature)\u003C/a>. Doolittle is an Athenaeum Research Fellow and Lecturer in Composition at the Royal Conservatoire of Scotland, where she has worked since 2017.",role:"advisory-board",web:{staff:"https://www.rcs.ac.uk/bio/emily-doolittle/",personal:"https://emilydoolittle.com/"}},james:{name:"James Cummings",img:"assets/people/james_cummings.jpg",url:"people/james",title:"Reader in Digital Textual Studies and Late Medieval Literature",affiliation:"Newcastle University",bio:"\u003Ca href='https://www.ncl.ac.uk/elll/people/profile/jamescummings.html' target='_blank'>James Cummings\u003C/a> is the Reader in Digital Textual Studies and Late-Medieval Literature in the \u003Ca href='https://www.ncl.ac.uk/elll/' target='_blank'>School of English\u003C/a> at \u003Ca href='https://www.ncl.ac.uk/' target='_blank'>Newcastle University\u003C/a>. He has a long history of volunteering for the \u003Ca href='https://tei-c.org/' target='_blank'>Text Encoding Initiative Consortium\u003C/a>, and a lot of his research relates to the creation, analysis, and publicaton of TEI-encoded documents. His late-medieval research interests relate to the history and editing of early performance texts, and he has collaborated for a long time with the \u003Ca href='https://ereed.org/' target='_blank'>Records of Early English Drama\u003C/a> project. He has helped instigate a number of Digital Humanities outreach, training, and awareness activities including \u003Ca href='https://digital.humanities.ox.ac.uk/digital-humanities-oxford-summer-school' target='_blank'>DHOxSS\u003C/a>, \u003Ca href='http://dhawards.org/' target='_blank'>DH Awards\u003C/a>, and \u003Ca href='https://digitalmedievalist.org/' target='_blank'>Digital Medievalist\u003C/a>. He has worked with many projects, but has particularly enjoyed advising the \u003Cem>Bee-ing Human\u003C/em> project because of its inherent interdisciplinarity.",role:"advisory-board",web:{staff:"https://www.ncl.ac.uk/elll/people/profile/jamescummings.html"}},rachel:{name:"Rachel Willie",img:"assets/people/rachel_willie.jpg",url:"people/rachel",title:"Reader in Early Modern Literary Studies",affiliation:"Liverpool John Moores University",bio:"Rachel Willie is Reader in Early Modern Literary Studies at Liverpool John Moores University, and she has a background is in English and Music. With the support of the AHRC, she co-founded the Soundscapes in the Early Modern World reseach network and it is through the work of the network that she was introduced to, and became fascinated by, Butler's bee-text. She has published widely on seventeenth-century English literary history and culture, where her research interests include 'the paper stage', emotions, the senses, materiality, politics and religion. Her most recent publication is a co-edited collection with Chloe Preedy on \u003Cem>Thomas Nashe and Literary Performance\u003C/em>, to which she contributed an essay on how Nashe's voice is ventriloquised in the mid-seventeenth century. She has articles forthcoming on literacy and orality in Nicholas Bownde, embodiment and voice in John Lyly, and soundmaking from the music of the spheres to the music of the beehive.",role:"advisory-board",web:{staff:"https://profiles.ljmu.ac.uk/11090-rachel-willie"},email:"R.J.Willie@ljmu.ac.uk"},"simon-jackson":{name:"Simon Jackson",img:"assets/people/simonJackson.jpg",url:"people/simon-jackson",title:"Director of Music and Director of Studies in English",affiliation:"Peterhouse, University of Cambridge",bio:"Simon Jackson is Director of Music and Director of Studies in English at Peterhouse, University of Cambridge. He is a former Leverhulme Early Career Fellow at the University of Warwick, where he is currently an Honorary Research Fellow in the Centre for the Study of the Renaissance. His work focuses primarily on seventeenth-century musico-poetics, and has won the George Herbert Society Chauncey Wood Award (2013) and an English Literary Renaissance Award (2015). He is the author of *George Herbert and Early Modern Musical Culture* (Cambridge University Press, 2022) and has recently released a CD of music from seventeenth-century Cambridge, *Music from the Peterhouse Partbooks*, with the Choir of Peterhouse, Cambridge (Naxos, 2025).",role:"advisory-board",web:{staff:"https://www.pet.cam.ac.uk/person/simon-jackson"},email:"simon.jackson@pet.cam.ac.uk"}}},uses:{}},{type:"data",data:{person:{name:"Candy Rowe",img:"assets/people/Candy.jpg",url:"people/candy",title:"Professor of Animal Behaviour and Cognition",affiliation:"Newcastle University",bio:"My background is in animal behaviour research, with my research at Newcastle University focussing on better understanding the psychology and behaviour of humans and other animals. My research is by nature interdisciplinary, combining evolutionary and behavioural biology, experimental psychology and visual neuroscience to understand the design of animal signals. My love of research was actually ignited through a project on honeybees on an undergraduate field course, and I've used bee sounds in some of my early experiments too – so it's been great to be involved with this project. I currently call myself a 'part-time researcher', as for the last 10 years or so, I've spent two or more days a week in a series of leadership roles – as an EDI Director for my faculty, the Director of our university's interdisciplinary fellowship scheme (NUAcT) and now as Dean for Research Culture & Strategy. These roles reflect my passion for creating inclusive and energising cultures and environments for people to work, grow and thrive, and find connections across different disciplines, job roles and sectors. This project has been an exciting journey for me, to see how humanities and sciences approaches and methods can be woven into an exploration of bee sounds, emotions and behaviours – I've learned a lot.",email:"",socials:{},web:{staff:"https://www.ncl.ac.uk/cbe/about/staff/profile/candyrowe.html"},role:"advisory-board",articles:[],buzzwords:[]}},uses:{params:["slug"],parent:1}}],
